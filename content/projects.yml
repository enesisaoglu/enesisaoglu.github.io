- name: RMIS
  tagline: Open-source humanoid robot that copies your movements
  status: Capstone project
  text: >-
    I designed and built a humanoid with 16+ controllable joints. A Kinect v2
    and MediaPipe track the person in front of it with under 50 ms of
    processing latency, and inverse kinematics turns their pose into joint
    angles in real time.
  stack: [ROS2, MediaPipe, Kinect v2, Inverse kinematics, Python]
  image: ""
  video: ""
  github: ""

- name: ADDIM-LEAF vision backend
  tagline: Eyes for an elderly-care robot that never leaves the house
  status: Research, UPCT
  text: >-
    Seven camera services for a companion robot that runs completely offline
    on a small PC. Several heavy vision models share one GPU through a
    VRAM-aware memory manager, so the robot keeps working without crashing.
  stack: [YOLOv8, SAM 3, Depth Anything V2, EasyOCR, Django REST Framework, PostgreSQL]
